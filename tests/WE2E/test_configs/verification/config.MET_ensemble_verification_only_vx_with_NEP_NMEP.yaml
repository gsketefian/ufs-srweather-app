metadata:
  description: |-
    This test is to ensure that the workflow running in community mode
    can successfully run the MET ensemble verification tasks, including
    calculation of neighborhood probabilities (NEP and NMEP), using staged
    observation and forecast files (i.e. with other tasks such as pre-
    processing, forecast, and post-processing deactivated).

user:
  RUN_ENVIR: community

workflow:
  PREDEF_GRID_NAME: RRFS_CONUS_25km
  DATE_FIRST_CYCL: '2019061500'
  DATE_LAST_CYCL: '2019061500'
  FCST_LEN_HRS: 6
  PREEXISTING_DIR_METHOD: rename
  taskgroups:
    - parm/wflow/verify_pre.yaml
    - parm/wflow/verify_det.yaml
    - parm/wflow/verify_ens.yaml

nco:
  NET_default: rrfs

global:
  DO_ENSEMBLE: true
  NUM_ENS_MEMBERS: 2

verification:
  VX_FCST_MODEL_NAME: FV3_GFS_v15p2_CONUS_25km
  VX_FCST_INPUT_BASEDIR: '{{ platform.TEST_VX_FCST_INPUT_BASEDIR }}'
  #
  DO_NEP: True
  DO_NMEP: True
  NBRHD_PROB_SHAPE: 'CIRCLE'
  NBRHD_PROB_WIDTHS: [15, 27]
  NBRHD_PROB_VLD_THRESH: 0.0
  #
  NMEP_SMOOTH_METHOD: 'GAUSSIAN'
  NMEP_SMOOTH_SHAPE: 'CIRCLE'
  NMEP_SMOOTH_WIDTH: 9
  NMEP_SMOOTH_VLD_THRESH: 0.5
  NMEP_SMOOTH_GAUSSIAN_RADIUS: 120
  NMEP_SMOOTH_GAUSSIAN_DX: 81.27

